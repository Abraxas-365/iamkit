# IAMKit behind Traefik v3 with Let's Encrypt (HTTP-01 or TLS-ALPN-01),
# HTTP → HTTPS redirect and HSTS. PostgreSQL, and optionally Redis and an
# OpenTelemetry collector, stay on an internal network.
#
#   ../setup.sh traefik iam.example.com ops@example.com
#   docker compose up -d --wait
#
# See docs/operations/deployment.md#compose-with-tls.

name: iamkit

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.http.acme.email=${ACME_EMAIL:?run ../setup.sh first}
      - --certificatesresolvers.http.acme.storage=/acme/http.json
      - --certificatesresolvers.http.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.tls.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.tls.acme.storage=/acme/tls.json
      - --certificatesresolvers.tls.acme.tlschallenge=true
      # Routes come from a file, not the Docker socket.
      - --providers.file.filename=/etc/traefik/dynamic.yml
    environment:
      IAMKIT_DOMAIN: ${IAMKIT_DOMAIN:?run ../setup.sh first}
      IAMKIT_ACME_CHALLENGE: ${IAMKIT_ACME_CHALLENGE:-http}
    ports:
      - "${IAMKIT_HTTP_PORT:-80}:80"
      - "${IAMKIT_HTTPS_PORT:-443}:443"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - acme:/acme
    networks:
      - edge

  # Copies secrets/jwt.pem into a volume readable only by the iamkit user
  # (the container does not run as root), on every start.
  keys:
    image: ${IAMKIT_IMAGE:-ghcr.io/abraxas-365/iamkit:latest}
    user: "0"
    entrypoint: ["sh", "-c", "cp /input/jwt.pem /secrets/jwt.pem && chown iamkit:iamkit /secrets/jwt.pem && chmod 400 /secrets/jwt.pem"]
    volumes:
      - ./secrets/jwt.pem:/input/jwt.pem:ro
      - keys:/secrets
    network_mode: none

  iamkit:
    image: ${IAMKIT_IMAGE:-ghcr.io/abraxas-365/iamkit:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://iamkit:${POSTGRES_PASSWORD:?run ../setup.sh first}@postgres:5432/iamkit?sslmode=disable
      JWT_ISSUER: https://${IAMKIT_DOMAIN}
      JWT_PRIVATE_KEY_PATH: /secrets/jwt.pem
      SERVER_PORT: "8080"
      # Only Traefik (on the edge network) may name the client.
      IAMKIT_TRUSTED_PROXIES: ${EDGE_SUBNET:-10.89.250.0/24}
    volumes:
      - keys:/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iamkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iamkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamkit -d iamkit"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend

  # Optional (COMPOSE_PROFILES=redis + REDIS_URL=redis://redis:6379/0):
  # shared rate limits and caches across replicas. Holds no data that
  # needs persistence.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    networks:
      - backend

  # Optional (COMPOSE_PROFILES=otel +
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318).
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    profiles: [otel]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - backend
      - egress

networks:
  # Traefik and IAMKit only: IAMKit trusts forwarded headers from it.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.89.250.0/24}
  backend:
    internal: true
  egress: {}

volumes:
  acme:
  keys:
  pgdata:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iamkit.fullname" . }}
  labels:
    {{- include "iamkit.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "iamkit.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "iamkit.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "iamkit.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "iamkit.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: iamkit
          image: {{ include "iamkit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "iamkit.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- include "iamkit.databaseEnv" . | nindent 12 }}
            - name: SERVER_PORT
              value: "8080"
            - name: JWT_ISSUER
              value: {{ include "iamkit.issuer" . | quote }}
            - name: JWT_PRIVATE_KEY_PATH
              value: /secrets/signing/{{ .Values.secrets.signingKey.key }}
            - name: OIDC_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.hmac.existingSecret is required" .Values.secrets.hmac.existingSecret }}
                  key: {{ .Values.secrets.hmac.key }}
            {{- with .Values.secrets.encryption }}
            {{- if .existingSecret }}
            - name: IAMKIT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .key }}
            {{- if .keyOld }}
            - name: IAMKIT_ENCRYPTION_KEYS_OLD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .keyOld }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.key }}
            {{- end }}
            - name: IAMKIT_WORKERS
              value: {{ .Values.workers.enabled | quote }}
            {{- with .Values.trustedProxies }}
            - name: IAMKIT_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.geoip.enabled }}
            - name: IAMKIT_GEOIP_DB
              value: {{ include "iamkit.geoipDatabase" . | quote }}
            {{- end }}
            {{- with .Values.geoip.header }}
            {{- if not $.Values.trustedProxies }}
            {{- fail "geoip.header needs trustedProxies (the header is believed only from a trusted proxy)" }}
            {{- end }}
            - name: IAMKIT_GEOIP_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: IAMKIT_METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: signing-key
              mountPath: /secrets/signing
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.geoip.enabled }}
            - name: geoip
              mountPath: {{ include "iamkit.geoipDir" . }}
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            # /health also fails while the database is down; give an outage
            # time before restarting healthy pods.
            failureThreshold: 6
          lifecycle:
            preStop:
              # Let endpoints drop the pod before it stops accepting.
              sleep:
                seconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.geoip.enabled }}
        - name: geoip-update
          image: "{{ .Values.geoip.image.repository }}:{{ .Values.geoip.image.tag }}"
          imagePullPolicy: {{ .Values.geoip.image.pullPolicy }}
          securityContext:
            {{- include "iamkit.containerSecurityContext" . | nindent 12 }}
          # entry.sh with GEOIPUPDATE_FREQUENCY=0 downloads once and exits;
          # the loop keeps a failing download from ever crashing the pod.
          command:
            - sh
            - -c
            - |
              while true; do
                if GEOIPUPDATE_FREQUENCY=0 /usr/bin/entry.sh; then
                  sleep {{ mul (int .Values.geoip.frequencyHours) 3600 }}
                else
                  echo "geoipupdate failed; retrying in 15 minutes" >&2
                  sleep 900
                fi
              done
          env:
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "geoip.existingSecret is required when geoip.enabled" .Values.geoip.existingSecret }}
                  key: {{ .Values.geoip.accountIdKey }}
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.geoip.existingSecret }}
                  key: {{ .Values.geoip.licenseKeyKey }}
            - name: GEOIPUPDATE_EDITION_IDS
              value: {{ .Values.geoip.editionId | quote }}
            - name: GEOIPUPDATE_DB_DIR
              value: {{ include "iamkit.geoipDir" . }}
          volumeMounts:
            - name: geoip
              mountPath: {{ include "iamkit.geoipDir" . }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.geoip.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: signing-key
          secret:
            secretName: {{ required "secrets.signingKey.existingSecret is required" .Values.secrets.signingKey.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secrets.signingKey.key }}
                path: {{ .Values.secrets.signingKey.key }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.geoip.enabled }}
        - name: geoip
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

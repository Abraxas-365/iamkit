<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Two-step verification · Lumen Health</title>

<style nonce="q1OWTGGnRMOTiciEeF3smw==">
:root{--radius:10px;--field-radius:6px;--pad:40px;--gap:16px;--align:center}:root{color-scheme:light;--accent:#1f9d8a;--on-accent:#000000;--link:#1f9d8a;--bg:#eef6f4;--card:#ffffff;--text:#12332e;--header:#ffffff;--on-header:#000000;--muted:color-mix(in srgb,#12332e 62%,#ffffff);--border:color-mix(in srgb,#12332e 18%,#ffffff);--error-bg:#fdecea;--error:#8a1c12;--notice-bg:#e8f4ea;--notice:#1c5a2a}:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--heading-font:var(--font)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);font:15px/1.5 var(--font);color:var(--text)}
.stage{flex:1;display:flex;align-items:center;justify-content:var(--align);padding:0 max(0px,calc((100vw - 1100px)/2))}
main{width:100%;max-width:380px;margin:24px;padding:var(--pad);background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);border:1px solid var(--border)}
.head{text-align:center;margin-bottom:24px}
.head img,.top img{max-height:48px;max-width:200px;vertical-align:middle}
.brand{font-weight:600;margin-top:8px}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--header);color:var(--on-header);border-bottom:1px solid var(--border)}
.top img{max-height:32px}
.top .brand{margin:0}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;padding:16px 24px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
h1{font-size:20px;margin:12px 0 4px;font-family:var(--heading-font)}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin:var(--gap) 0 4px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--field-radius);background:var(--card);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{width:100%;margin-top:16px;padding:10px 12px;border:0;border-radius:var(--field-radius);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
button.provider{display:flex;align-items:center;justify-content:center;gap:10px}
button.provider svg{width:18px;height:18px;flex:none}
button.link{background:none;color:var(--link);padding:0;margin-top:8px;width:auto;font-weight:400}
.error{padding:10px 12px;margin-bottom:16px;border-radius:var(--field-radius);background:var(--error-bg);color:var(--error)}
.notice{padding:10px 12px;margin-bottom:16px;border-radius:var(--field-radius);background:var(--notice-bg);color:var(--notice)}
.divider{text-align:center;color:var(--muted);margin:20px 0 4px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--muted);font-size:13px}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:20px;font-size:13px;color:var(--muted)}.legal a{color:var(--muted)}
label.check{display:flex;align-items:flex-start;gap:8px;font-weight:400}label.check input{margin-top:4px}label.check a{color:var(--link)}
.account{display:flex;align-items:center;gap:12px;margin:0 0 16px}.account p{margin:0}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
img.qr{display:block;margin:0 auto 16px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:6px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
ul.codes{list-style:none;padding:0;margin:0 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
ul.codes li{padding:6px 8px;background:var(--bg);border-radius:6px;text-align:center}
[dir=rtl] input[type=email],[dir=rtl] input[inputmode=email],[dir=rtl] input[type=password],[dir=rtl] input[inputmode=numeric],[dir=rtl] code,[dir=rtl] ul.codes{direction:ltr}
</style>
</head>
<body>

<div class="stage">
<main>
<div class="head">
<div class="brand">Lumen Health</div>
<h1>Two-step verification</h1>
<p>Enter the 6-digit code from your authenticator app, or a recovery code.</p>
</div>
<div class="error" role="alert">That code is not valid. Try again.</div>



<form method="post" action="/hosted/login/mfa">
<input type="hidden" name="ticket" value="">
<input type="hidden" name="factors" value="">
<label for="code">Code</label>
<input id="code" type="text" name="code" maxlength="20" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required autofocus>
<button type="submit">Verify</button>
</form>


<form method="get" action="/hosted/login">
<input type="hidden" name="ticket" value="">
<button type="submit" class="link">Start over</button>
</form>

</main>
</div>


</body>
</html>

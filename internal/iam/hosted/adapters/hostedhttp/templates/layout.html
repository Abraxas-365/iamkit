{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Brand.Name}}</title>
<style nonce="{{.Nonce}}">
:root{--accent:{{.Brand.Accent}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1d1f}
main{width:100%;max-width:380px;margin:24px;padding:32px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06)}
header{text-align:center;margin-bottom:24px}
header img{max-height:48px;max-width:200px}
h1{font-size:20px;margin:12px 0 4px}
p{margin:0 0 16px;color:#555}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{width:100%;margin-top:16px;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#fff;color:#1d1d1f;border:1px solid #ccc}
button.link{background:none;color:var(--accent);padding:0;margin-top:8px;width:auto;font-weight:400}
.error{padding:10px 12px;margin-bottom:16px;border-radius:8px;background:#fdecea;color:#8a1c12}
.notice{padding:10px 12px;margin-bottom:16px;border-radius:8px;background:#e8f4ea;color:#1c5a2a}
.divider{text-align:center;color:#888;margin:20px 0 4px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px}
.muted{color:#888;font-size:13px}
img.qr{display:block;margin:0 auto 16px;image-rendering:pixelated}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
ul.codes{list-style:none;padding:0;margin:0 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
ul.codes li{padding:6px 8px;background:#f5f5f7;border-radius:6px;text-align:center}
</style>
</head>
<body>
<main>
<header>
{{if .Brand.Logo}}<img src="{{.Brand.Logo}}" alt="">{{end}}
<h1>{{.Title}}</h1>
{{if .Subtitle}}<p>{{.Subtitle}}</p>{{end}}
</header>
{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="notice" role="status">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}

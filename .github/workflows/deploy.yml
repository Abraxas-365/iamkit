name: Deployment artifacts

on:
  pull_request:
    paths:
      - deploy/**
      - Dockerfile
      - .dockerignore
      - cmd/iamkit/**
      - internal/server/**
      - internal/bootstrap/**
      - .github/workflows/deploy.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    # Both Compose variants on local ports with the image built here:
    # HTTPS, redirect, HSTS, issuer, forwarded client address, Redis and the
    # collector (deploy/compose/smoke.sh).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [traefik, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iamkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          bash -n deploy/compose/setup.sh deploy/compose/smoke.sh
          deploy/compose/smoke.sh ${{ matrix.variant }} iamkit:ci

  helm:
    # chart-testing: lint, then install on kind (pre-install migrations,
    # two replicas ready, helm test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: helm/chart-testing-action@v2
      - name: Lint
        run: ct lint --config deploy/helm/ct.yaml --charts deploy/helm/iamkit
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iamkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: iamkit-ct
      - name: Prerequisites (PostgreSQL, Secrets)
        run: |
          kind load docker-image iamkit:ci --name iamkit-ct
          kubectl create namespace iamkit-ct
          kubectl -n iamkit-ct apply -f deploy/helm/ci/prerequisites.yaml
          openssl genrsa -out "$RUNNER_TEMP/jwt.pem" 2048
          kubectl -n iamkit-ct create secret generic iamkit-ci-signing --from-file=jwt.pem="$RUNNER_TEMP/jwt.pem"
          kubectl -n iamkit-ct rollout status deploy/iamkit-ci-postgres --timeout=180s
      - name: Install
        run: >-
          ct install --config deploy/helm/ct.yaml --charts deploy/helm/iamkit --namespace iamkit-ct
          --helm-extra-set-args "--set=image.repository=iamkit --set=image.tag=ci --set=image.pullPolicy=Never"
          --helm-extra-args "--timeout 300s"

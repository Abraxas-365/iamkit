name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'frontend/src/theme.css'
      - 'scripts/check_docs.py'
      - 'scripts/test_check_docs.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'frontend/src/theme.css'
      - 'scripts/check_docs.py'
      - 'scripts/test_check_docs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://abraxas-365.github.io
      SITE_BASE_PATH: /iamkit/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check documentation sources
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_docs.py'
          python3 scripts/check_docs.py
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Test and build project site
        working-directory: website
        run: |
          npm test
          python3 -m unittest discover -s scripts -p 'test_check_links.py'
          npm run check
          npm run build
          npm run check:links
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

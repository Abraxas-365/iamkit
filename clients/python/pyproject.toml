[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iamkit"
version = "0.1.0"
description = "Server-side IAMKit SDK for Python: access token verification (JWKS or introspection), OAuth/OIDC client flows, webhook and action verification, API key validation and a thin management client (sync and async)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SEE LICENSE IN ../../README.md" }
keywords = ["iamkit", "iam", "oauth", "oidc", "jwt", "webhooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3"]
django = ["django>=4.2"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastapi>=0.110",
  "flask>=3",
  "django>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iamkit"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/iamkit/_resources.py" = ["UP028"]  # async twin needs `yield` in a loop
"src/iamkit/_aresources.py" = ["E501"]
"tests/**" = ["E501", "PT018", "PT011", "B008", "B017", "SIM117"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["django", "django.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["iamkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

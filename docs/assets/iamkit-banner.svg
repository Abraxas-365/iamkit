<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">IAMKit — your identity layer, your product experience</title>
  <desc id="description">IAMKit: self-hosted identity and access for apps and services. Sign in with passwords, email OTP or OIDC SSO. Model access with organizations, roles and permissions. Integrate with OAuth, SCIM and the Go SDK. Charcoal, warm-white and muted-blue colors match the operator console.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #d4d0c8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; letter-spacing: 1px; fill: #7b9bae; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; fill: #a8a49a; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#222220"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="8" fill="#0c0c0a"/>
  <rect width="1200" height="400" rx="8" fill="url(#grid)" opacity=".45"/>
  <path d="M48 66L60 78L48 90M74 90H94" fill="none" stroke="#7b9bae" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="84" class="mono">SELF-HOSTED IDENTITY &amp; ACCESS</text>
  <text x="44" y="204" font-family="Consolas, monospace" font-size="92" font-weight="700" letter-spacing="-4">IAM<tspan fill="#7b9bae">Kit</tspan></text>
  <text x="48" y="258" font-size="28" font-weight="700">Your identity layer.</text>
  <text x="48" y="295" font-size="28" font-weight="700">Your product experience.</text>
  <text x="48" y="351" class="body">One Go binary + PostgreSQL. For apps and services.</text>

  <rect x="670" y="40" width="482" height="320" rx="6" fill="#131311" stroke="#222220"/>
  <path d="M670 46Q670 40 676 40H1146Q1152 40 1152 46" fill="none" stroke="#7b9bae" stroke-width="2"/>
  <text x="698" y="78" class="mono">ONE PLATFORM / YOUR OWN UI</text>
  <text x="698" y="119" class="heading">Sign users in</text>
  <text x="698" y="146" class="body">Password · email OTP · OIDC SSO</text>
  <path d="M698 169H1124" stroke="#222220"/>
  <text x="698" y="203" class="heading">Control access</text>
  <text x="698" y="230" class="body">Organizations · roles · permissions</text>
  <path d="M698 253H1124" stroke="#222220"/>
  <text x="698" y="287" class="heading">Connect your services</text>
  <text x="698" y="314" class="body">OAuth 2.0 · SCIM · Go SDK</text>
  <text x="698" y="341" font-size="14" fill="#7b9bae">Operator console included in Docker</text>
</svg>

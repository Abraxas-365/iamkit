name: iamkit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iamkit
      POSTGRES_PASSWORD: iamkit_local
      POSTGRES_DB: iamkit
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamkit -d iamkit"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  identity_data:
